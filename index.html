<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HI-SCORE BOARD</title>
<style>
:root{--bg:#000;--y:#FFD800;--c:#00FFFF;--w:#fff;--dim:rgba(255,255,255,.45);}
body{margin:0;background:var(--bg);color:var(--y);font-family:"Courier New","MS Gothic",monospace;display:grid;place-items:center;min-height:100vh;}
.screen{width:min(980px,95vw);padding:18px 16px 22px;background:var(--bg);border:6px solid var(--w);box-shadow:0 0 0 4px var(--c),0 20px 60px rgba(0,0,0,.55);}
.pacTitle{width:100%;height:auto;display:block;margin:0 auto 8px;}
.titleText{font-size:42px;font-weight:900;letter-spacing:.14em;text-align:center;margin:8px 0 10px;color:var(--y);}
.subtitle{text-align:right;font-size:12px;color:var(--c);margin:0 2px 10px;}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:820px){.panels{grid-template-columns:1fr;}}
.panel{border:3px solid var(--w);padding:10px 10px 8px;}
.panel h2{margin:0 0 8px;font-size:18px;letter-spacing:.18em;}
.panel[data-mode="HI-SCORE"] h2{color:var(--y);}
.panel[data-mode="CARAVAN"] h2{color:var(--c);}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
th{text-align:left;font-size:12px;color:var(--dim);border-bottom:2px solid rgba(255,255,255,.28);padding:4px;letter-spacing:.10em;}
td{padding:7px 4px;font-size:14px;}
td.rank{width:14%;color:var(--w);}
td.player{width:60%;color:var(--w);}
td.mvp{width:26%;text-align:right;color:var(--y);font-weight:900;}
tbody.rankBody tr:first-child td.mvp{animation:blink 1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}
.update{margin-top:14px;border:3px solid var(--c);padding:10px 10px 8px;}
.update h3{margin:0 0 8px;color:var(--c);letter-spacing:.18em;font-size:16px;}
.update table{margin-top:8px;}
.update td.score{color:var(--c);font-weight:900;}
.modeLabel{margin:6px 0 2px;font-weight:900;letter-spacing:.12em;}
.insertCoin{text-align:center;margin-top:12px;color:var(--y);letter-spacing:.12em;animation:blink 1s steps(1) infinite;}
</style>
</head>
<body>
<div class="screen">
  <div class="titleText">HI-SCORE BOARD</div>
  <div class="subtitle">UPDATED: 2026/08/30 19:50</div>
  <div class="panels" id="root"></div>
  <div id="updates"></div>
  <div class="insertCoin">INSERT COIN ▶</div>
</div>

<script>
const DATA = {"updatedAt":"2026/08/30 19:50","ranking":[{"name":"HI-SCORE","rows":[{"rank":1,"player":"CLOBTA_","mvp":22},{"rank":2,"player":"BIG7657651_","mvp":17},{"rank":3,"player":"tyosi0211","mvp":16},{"rank":4,"player":"Ikazabihs","mvp":12},{"rank":5,"player":"kumori-0706","mvp":11},{"rank":6,"player":"MBK-GIL","mvp":11},{"rank":7,"player":"bh700","mvp":9},{"rank":8,"player":"T3-TBC","mvp":8},{"rank":9,"player":"kensue316x68000","mvp":8},{"rank":10,"player":"TACT1982","mvp":7}]},{"name":"CARAVAN","rows":[{"rank":1,"player":"T3-CYR-WIZ","mvp":48},{"rank":2,"player":"CLOBTA_","mvp":46},{"rank":3,"player":"misorice","mvp":19},{"rank":4,"player":"bh700","mvp":17},{"rank":5,"player":"T3-TBC","mvp":16},{"rank":6,"player":"MBK-GIL","mvp":14},{"rank":7,"player":"Game-Beginner00","mvp":10},{"rank":8,"player":"lettuce702","mvp":9},{"rank":9,"player":"kumori-0706","mvp":9},{"rank":10,"player":"savecolony","mvp":9}]}],"update":[{"name":"ハイスコア","rows":[{"game":"メガブラスト","score":"823500","name":"cyrtis_akinya"},{"game":"パック&パル","score":"","name":"MBK-GIL"},{"game":"アラビアン","score":"141850","name":"morinari"},{"game":"シティコネクション","score":"","name":"guu-nabe1294rvr"},{"game":"F/A","score":"1949700","name":"Alarin"},{"game":"F/A","score":"2029850","name":"ds_dangermelon4"},{"game":"F/A","score":"2022700","name":"ds_dangermelon4"},{"game":"VS. スターラスター","score":"3944","name":"ma-ji__"},{"game":"特殊部隊ジャッカル","score":"9999900","name":"CLOBTA_"},{"game":"超時空要塞マクロスII","score":"3453870","name":"hirahirahiraco"},{"game":"超時空要塞マクロスII","score":"3654980","name":"GOFERnoYabou"},{"game":"超時空要塞マクロスII","score":"4620210","name":"kyoizumi-kn"},{"game":"コンバットスクール","score":"376310","name":"tyosi0211"},{"game":"ビーチバレー V'BALL","score":"46","name":"gaki_system0304"},{"game":"ビーチバレー V'BALL","score":"46","name":"helldriver75"},{"game":"アルマジロレーシング","score":"37\"63","name":"cave-maniac"},{"game":"アルマジロレーシング","score":"37\"35","name":"Tudanuma_Man"},{"game":"TX-1","score":"274600","name":"UtoiAyumi_Vtuber"},{"game":"サイバリオン","score":"17968170","name":"hayachan-5730"},{"game":"サイバーサイクルズ","score":"01:51.614","name":"Tudanuma_Man"},{"game":"サイバーサイクルズ","score":"03:24.760","name":"kurobara_yuk"}]},{"name":"キャラバン","rows":[{"game":"メガブラスト","score":"230500","name":"cyrtis_akinya"},{"game":"マーカム","score":"287890","name":"Mikasen_"},{"game":"アラビアン","score":"66850","name":"misorice"},{"game":"沙羅曼蛇","score":"386300","name":"T3-TBC/T3-CYR-WIZ"},{"game":"シティコネクション","score":"307600","name":"guu-nabe1294rvr"},{"game":"VS. スターラスター","score":"276","name":"ma-ji__"},{"game":"ラスタンサーガII","score":"113600","name":"mikoto1982"},{"game":"妖魔忍法帖","score":"214700","name":"mikoto1982"},{"game":"VS. ワルキューレの冒険 時の鍵伝説","score":"12820","name":"CLOBTA_"},{"game":"ハードパンチャー 血まみれの栄光","score":"1632150","name":"larky-fragment67"},{"game":"ハードパンチャー 血まみれの栄光","score":"1057800","name":"misorice"},{"game":"沙羅曼蛇","score":"328300","name":"T3-CYR-WIZ"},{"game":"沙羅曼蛇","score":"328300","name":"T3-CYR-WIZ"},{"game":"超時空要塞マクロスII","score":"2480660","name":"kyoizumi-kn"},{"game":"航空騎兵物語","score":"133000","name":"T3-CYR-ATS"},{"game":"サイバリオン","score":"9350060","name":"goburei-sapporo"},{"game":"アルマジロレーシング","score":"15.36","name":"cave-maniac"},{"game":"アルマジロレーシング","score":"8.18","name":"cave-maniac"},{"game":"コンバットスクール","score":"264010","name":"tyosi0211"},{"game":"ビーチバレー V'BALL","score":"19","name":"misorice"},{"game":"ビーチバレー V'BALL","score":"20","name":"misorice"},{"game":"サイバーサイクルズ","score":"9.02","name":"Tudanuma_Man"},{"game":"サイバーサイクルズ","score":"3.86","name":"kurobara_yuk"},{"game":"サタン オブ サターン","score":"29320","name":"CLOBTA_"}]}]};
const root = document.getElementById("root");
const upd  = document.getElementById("updates");

function esc(s){
  return String(s??"").replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function fmt(n){
  const s=String(n??"");
  if(!/^\d+$/.test(s)) return s;
  return Number(s).toLocaleString("ja-JP");
}

// ===== RANKING =====
(DATA.ranking||[]).forEach(function(m){
  const d=document.createElement("div");
  d.className="panel";
  d.dataset.mode=m.name;

  const rowsHtml=(m.rows||[]).map(function(r){
    return "<tr>"
      + "<td class=\"rank\">"+esc(r.rank ?? "")+"</td>"
      + "<td class=\"player\">"+esc(String(r.player ?? "").replace(/[\n\r]/g,""))+"</td>"
      + "<td class=\"mvp\">"+fmt(r.mvp)+"</td>"
      + "</tr>";
  }).join("");

  d.innerHTML =
    "<h2>"+esc(m.name)+"</h2>"
    + "<table>"
    + "<thead><tr><th>Rank</th><th>Player</th><th>MVP Count</th></tr></thead>"
    + "<tbody class=\"rankBody\">"+rowsHtml+"</tbody>"
    + "</table>";

  root.appendChild(d);
});

// ===== UPDATE LOG（モード見出し付き）=====
if (DATA.update && DATA.update.length){
  const box=document.createElement("div");
  box.className="update";
  box.innerHTML="<h3>UPDATE LOG</h3>";

  (DATA.update||[]).forEach(function(m){
    const label = String(m.name || "");
    const h=document.createElement("div");
    h.className="modeLabel";
    h.style.color = (label.indexOf("キャラバン") !== -1) ? "var(--c)" : "var(--y)";
    h.textContent = "▶ " + label;

    const rowsHtml=(m.rows||[]).map(function(r){
      return "<tr>"
        + "<td>"+esc(r.name ?? "")+"</td>"
        + "<td class=\"score\">"+esc(r.score ?? "")+"</td>"
        + "<td>"+esc(String(r.game ?? "").replace(/[\n\r]/g,""))+"</td>"
        + "</tr>";
    }).join("");

    const t=document.createElement("table");
    t.innerHTML =
      "<thead><tr><th>Player</th><th>Score</th><th>Game</th></tr></thead>"
      + "<tbody>"+rowsHtml+"</tbody>";

    box.appendChild(h);
    box.appendChild(t);
  });

  upd.appendChild(box);
}
</script>
</body>
</html>
